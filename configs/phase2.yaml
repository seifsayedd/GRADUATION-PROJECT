# Phase 2 configuration. Paths are relative to the repo root.
seed: 42

data:
  bigflow_dir: data/external/bigflow
  interim_dir: data/interim/phase2
  lab_csv: data/processed/combined_sessions_full.csv
  # Stage 1/3 training sample: rows per Attack class (rare classes are kept whole).
  per_class_cap: 100000
  # Benign gets a larger cap to keep a realistic share of benign traffic.
  class_caps:
    Benign: 1000000
  val_size: 0.15
  test_size: 0.15
  # Unseen-attack test: these classes never enter train/val/test.
  holdout_attacks: [SSH-Bruteforce, DoS_attacks-Slowloris, Backdoor]

feature_sets:
  # "full": every usable BigFlow feature. "lab": only features the lab sensor can fill.
  - full
  - lab

stage1:
  models: [random_forest, xgboost]
  random_forest:
    n_estimators: 150
    max_depth: 24
    min_samples_leaf: 3
    max_samples: 0.5
  xgboost:
    n_estimators: 600
    early_stopping_rounds: 30
    grid:                    # small search, picked on the validation split
      max_depth: [6, 10]
      learning_rate: [0.1, 0.3]

stage2:
  # Contiguous time slices (all flows, no sampling) so per-host order is real.
  # Chosen to cover C2 beaconing (Bot), scanning, brute force and slow DoS,
  # each with the surrounding benign traffic. No slice contains a held-out class
  # (2018-02-14 was rejected: it holds SSH-Bruteforce).
  slices:
    - {name: cic_bot,      start: "2018-03-02", end: "2018-03-03"}   # Bot 207k
    - {name: cic_slowdos,  start: "2018-02-16", end: "2018-02-17"}   # SlowHTTPTest, Hulk
    - {name: ton_scanning, start: "2019-04-23", end: "2019-04-24"}   # scanning 262k
    - {name: ton_password, start: "2019-04-26", end: "2019-04-27"}   # password 1.0M, DDoS 1.7M
  # Hosts that sent any attack flow are always kept whole; benign-only hosts are
  # sampled (whole hosts, so sequences stay intact) until the slice has this many rows.
  max_rows_per_slice: 1500000
  window: 32
  block_minutes: 5       # whole blocks go to train/val/test (see models/sequence.py)
  cell: gru               # gru or lstm
  hidden: 64
  epochs: 8
  batch_size: 1024
  lr: 0.001

stage3:
  hidden: [64, 16]
  epochs: 20
  batch_size: 4096
  lr: 0.001
  threshold_percentile: 99.0   # on benign validation errors -> ~1% FPR target
