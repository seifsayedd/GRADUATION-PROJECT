[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai"
version = "0.1.0"
description = "SentinelAI Blue Team: flow-based detection, explainability and reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6",
    "xgboost>=2.0",
    "torch>=2.2",
    "matplotlib>=3.7",
    "shap>=0.46",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
genai = ["anthropic>=2.0", "sentence-transformers>=3.0", "psycopg[binary]>=3.1", "pgvector>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
