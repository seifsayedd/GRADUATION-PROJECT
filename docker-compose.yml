# PostgreSQL 16 with pgvector for Phase 5. Not required: without DATABASE_URL the
# in-memory store is used. Start with:  docker compose up -d   (POSTGRES_PASSWORD from .env)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_DB: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
